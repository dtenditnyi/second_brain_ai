<!DOCTYPE html>
<html lang="en" data-theme="cyberpunk" data-accent="cyan">
<head>
    <!-- Authentication page uses the shared compiled theme and responsive metadata. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0D0D12">
    <style>html{background:#0D0D12}</style>
    <title>Second Brain - Core Terminal Authentication</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="{% static 'icons/icon.svg' %}" type="image/svg+xml">
</head>
<body class="bg-[#0D0D12] min-h-screen min-h-dvh w-full flex items-center justify-center relative font-sans overflow-x-hidden py-6">
    
    <!-- Ambient accent layers sit behind the centered authentication card. -->
    <div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true">
    <div class="pointer-events-none absolute top-1/4 left-1/4 w-40 h-40 min-[400px]:w-64 min-[400px]:h-64 sm:w-96 sm:h-96 bg-[#00F0FF] opacity-5 rounded-full blur-[120px]"></div>
    <div class="pointer-events-none absolute bottom-1/4 right-1/4 w-40 h-40 min-[400px]:w-64 min-[400px]:h-64 sm:w-96 sm:h-96 bg-[#B026FF] opacity-5 rounded-full blur-[120px]"></div>
    </div>

    <!-- Credential form and validation feedback supplied by login_view. -->
    <main class="w-full max-w-md p-4 relative z-10" style="padding-left:max(1rem,var(--safe-left));padding-right:max(1rem,var(--safe-right))">
        <div class="glass-card rounded-2xl p-6 sm:p-8 shadow-2xl border border-white/10 ">
            <header class="text-center mb-8">
                <h1 class="text-3xl font-extrabold text-white tracking-tight mb-2">System Access</h1>
                <p class="text-gray-400 text-sm">Initialize validation keys to load your Second Brain core.</p>
            </header>

            {% if error %}
                <div class="mb-6 alert alert-danger font-medium" role="alert">
                    ⚠️ {{ error }}
                </div>
            {% endif %}

            <form method="POST" class="flex flex-col gap-5">
                {% csrf_token %}
                <div class="flex flex-col gap-2">
                    <label for="id_username" class="text-xs uppercase tracking-wider font-semibold text-gray-300">Username</label>
                    <input type="text" name="username" id="id_username" required autofocus autocomplete="username" autocapitalize="none" spellcheck="false" class="input-field rounded-xl px-4 py-3 w-full bg-black/40 text-white border border-white/10 transition-all" placeholder="Enter security handle...">
                </div>

                <div class="flex flex-col gap-2">
                    <label for="id_password" class="text-xs uppercase tracking-wider font-semibold text-gray-300">Password Encryption Key</label>
                    <input type="password" name="password" id="id_password" required autocomplete="current-password" class="input-field rounded-xl px-4 py-3 w-full bg-black/40 text-white border border-white/10 transition-all" placeholder="Enter key matrices...">
                </div>

                <button type="submit" class="btn btn-solid w-full py-3.5 mt-4 rounded-xl uppercase tracking-wider">
                    Authenticate Session
                </button>
            </form>

            <!-- Route new operators to account registration. -->
            <footer class="mt-8 text-center border-t border-white/5 pt-6">
                <p class="text-sm text-gray-400">
                    New database operator? 
                    <a href="{% url 'register' %}" class="text-[#00F0FF] font-semibold underline-offset-2 hover:underline ml-1 inline-flex items-center min-h-11">Create an Identity</a>
                </p>
            </footer>
        </div>
    </main>
    <!-- Round 5 (F4): signed out → drop offline copies of notes (pwa.js, sb-clear-cache). -->
    <div id="sb-clear-cache" hidden></div>
    <script src="{% static 'js/pwa.js' %}"></script>
</body>
</html>
