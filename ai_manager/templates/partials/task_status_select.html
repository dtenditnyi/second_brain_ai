<!-- Status control used on the Tasks page and the Home board (Q10); tasks.js posts the change. -->
<select id="status-{{ task.id }}-{{ status_ctx|default:'x' }}" class="task-status-select status-select input-field rounded-lg" data-id="{{ task.id }}" data-current="{{ task.status }}" aria-label="Status" title="Change status">
    <option value="todo" {% if task.status == 'todo' %}selected{% endif %}>To Do</option>
    <option value="in_progress" {% if task.status == 'in_progress' %}selected{% endif %}>In Progress</option>
    <option value="done" {% if task.status == 'done' %}selected{% endif %}>Done</option>
</select>
