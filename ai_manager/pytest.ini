[pytest]
DJANGO_SETTINGS_MODULE = ai_manager.settings_test
testpaths = tests
python_files = test_*.py
addopts = -p no:cacheprovider --browser-channel msedge
markers =
    e2e: browser end-to-end tests (Playwright + live_server)
    responsive: responsive-layout browser tests
    characterization: pins current behaviour whose intent is unclear (see docs/audit/QUESTIONS.md)
filterwarnings =
    ignore::DeprecationWarning
