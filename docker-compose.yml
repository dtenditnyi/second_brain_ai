# Second Brain AI — production stack for the home server (Round 3 / G-B1, docs/DEPLOY.md).
#
#   docker compose up -d --build        start / update
#   docker compose ps                   status (healthchecks)
#
# Nothing is published to the internet directly: the site is reachable only through
# the Cloudflare tunnel. The web port is bound to 127.0.0.1 by default (WEB_BIND can
# open it to the LAN, e.g. WEB_BIND=192.168.1.50:8000). Postgres is never published.
# The project name defaults to the folder name, so the existing volumes are reused.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  image: secondbrain-web:${IMAGE_TAG:-latest}
  build: .
  env_file:
    - ${ENV_FILE:-.env}
  environment:
    TZ: Europe/Bucharest
    DB_HOST: db
    DB_PORT: "5432"
    LOG_DIR: /app/ai_manager/logs
    HF_HOME: /data/hf_cache
  volumes:
    - chroma_db:/app/ai_manager/chroma_db
    - obsidian_data:/app/ai_manager/obsidian_data
    - hf_cache:/data/hf_cache
    - app_logs:/app/ai_manager/logs
    - staticfiles:/app/ai_manager/staticfiles
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      TZ: Europe/Bucharest
      PGTZ: Europe/Bucharest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-myuser}\" -d \"$${POSTGRES_DB:-second_brain}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  web:
    <<: *app
    command: ["web"]
    ports:
      - "${WEB_BIND:-127.0.0.1:8000}:8000"
    # Shared network with the Link2Note bot (it calls http://secondbrain-web:8000/api/v1).
    networks:
      default:
      secondbrain:
        aliases: ["${SECOND_BRAIN_CONTAINER:-secondbrain-web}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    depends_on:
      db:
        condition: service_healthy

  # Pulls every user's tasks note and sends queued offline changes (manage.py sync_tasks).
  scheduler:
    <<: *app
    command: ["scheduler", "sync_tasks", "--all", "--if-stale"]
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy

  tunnel:
    # Pin a tested version in .env (CLOUDFLARED_IMAGE=cloudflare/cloudflared:<tag>), see DEPLOY.md.
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      TZ: Europe/Bucharest
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

networks:
  # Created by this stack; the bot's compose joins it as `external: true` (DOCKER_NETWORK).
  secondbrain:
    name: ${DOCKER_NETWORK:-secondbrain}

volumes:
  postgres_data:
  chroma_db:
  obsidian_data:
  hf_cache:
  app_logs:
  staticfiles:
